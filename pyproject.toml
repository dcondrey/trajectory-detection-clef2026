[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "trajectory-detection-clef2026"
version = "1.0.0"
description = "Domain-robust AI source detection and safety classification with multi-LLM ensemble (PAN@CLEF 2026)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "David Condrey"}
]
keywords = [
    "AI-detection",
    "safety-classification",
    "domain-shift",
    "LLM",
    "CLEF",
    "PAN",
    "reasoning-traces",
    "multilingual",
    "authorship-verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
llm = [
    "httpx>=0.27",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
]
all = [
    "trajectory-detection-clef2026[llm,dev]",
]

[project.urls]
Homepage = "https://github.com/davidcondrey/trajectory-detection-clef2026"
Paper = "https://ceur-ws.org/"
Issues = "https://github.com/davidcondrey/trajectory-detection-clef2026/issues"

[tool.setuptools.packages.find]
include = ["rtd*", "llm_ensemble*"]

[tool.ruff]
line-length = 100
target-version = "py310"
