[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-detection-clef2026"
version = "1.0.0"
description = "Reasoning Trajectory Detection for PAN@CLEF 2026: vocabulary fingerprints, multilingual refusal detection, and LLM ensemble classification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "David Condrey"},
]
keywords = ["nlp", "ai-detection", "safety", "clef", "pan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
llm = [
    "httpx>=0.25",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/davidcondrey/trajectory-detection-clef2026"

[tool.setuptools.packages.find]
include = ["rtd*", "llm_ensemble*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
